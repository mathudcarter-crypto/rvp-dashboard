<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<body>
  <div id="root"></div>

 <script type="text/babel" data-type="module">
    const { useState, useEffect, useRef } = React;

    const API_URL = "https://tight-waterfall-1040.mathudcarter.workers.dev/api/stores";

    const DEFAULT_PRESETS = [
      "Coming hot out of the gate today! 💪",
      "🏆Top Sales for the week!",
      "🏆Top Sales for the month!",
      "Wowee wow wow! 🔥",
      "Nicely done today! ⚡",
      "Honey of a week!",
      "Honey of a day!",
      "Nice work today!",
      "Boy, that escalated quickly. I mean, sales really got out of hand fast!",
      "Great day today y'all! Thank you for your hard work!💰💰",
      "And ANOTHER great day!🤑🤑🤑",
      "That’s a bold strategy, Cotton. Do it again tomorrow? 🙌",
    ];

    const STORAGE_KEY = "rvp-preset-messages";
    const loadPresets = () => {
      try {
        const s = localStorage.getItem(STORAGE_KEY);
        return s ? JSON.parse(s) : DEFAULT_PRESETS;
      } catch {
        return DEFAULT_PRESETS;
      }
    };
    const savePresets = (msgs) => localStorage.setItem(STORAGE_KEY, JSON.stringify(msgs));

    const getCity = (store) => {
      if (!store["Store"]) return "?";
      return store["Store"].replace("Home Outlet", "").trim();
    };
    const getAbbrev = (store) => {
      if (store["Store Abbrev"]) return store["Store Abbrev"];
      return getCity(store).split(" ")[0];
    };

    const fmtCurrency = (v) => {
      if (v === null || v === undefined) return "$0";
      const n = Number(v) || 0;
      if (n >= 1000000) return "$" + (n / 1000000).toFixed(2) + "M";
      if (n >= 1000) return "$" + (n / 1000).toFixed(1) + "K";
      return "$" + n.toFixed(0);
    };

    const FIELD_MAP = {
      sales: {
        today: { current: "Sales_Today", ly: "Sales_TodayLY" },
        wtd: { current: "Sales_WTD", ly: "Sales_WTDLY" },
        mtd: { current: "Sales_MTD", ly: "Sales_MTDLY" },
        ytd: { current: "Sales_YTD", ly: "Sales_YTDLY" },
      },
      gp: {
        today: { current: "GP_Today", ly: "GP_TodayLY" },
        wtd: { current: "GP_WTD", ly: "GP_WTDLY" },
        mtd: { current: "GP_MTD", ly: "GP_MTDLY" },
        ytd: { current: "GP_YTD", ly: "GP_YTDLY" },
      },
    };

    const TIME_LABEL = { today: "Today", wtd: "This Week", mtd: "This Month", ytd: "This Year" };

    // Generate smart contextual message for a store
    const buildSmartMessage = (store, allStores, timeframe, metric) => {
      const field = FIELD_MAP[metric][timeframe].current;
      const metricLabel = metric === "sales" ? "Sales" : "GP$";
      const timeLabel = TIME_LABEL[timeframe];
      const city = getCity(store);
      const myVal = store[field] || 0;

      const sorted = [...allStores].sort((a, b) => (b[field] || 0) - (a[field] || 0));
      const myRank = sorted.findIndex((s) => s["Store"] === store["Store"]) + 1;
      const total = sorted.length;

      if (myRank === 1) {
        return `🏆 ${city} is leading the pack in ${metricLabel} ${timeLabel} at ${fmtCurrency(myVal)}!🔥`;
      }

      const ahead = sorted[myRank - 2];
      const aheadCity = getCity(ahead);
      const aheadVal = ahead[field] || 0;
      const diff = fmtCurrency(aheadVal - myVal);

      const suffix = myRank === total ? "(last place)" : `(#${myRank} of ${total})`;
      return `You're only ${diff} behind ${aheadCity} for #${myRank - 1} in ${metricLabel} ${timeLabel} ${suffix}. You've got this! 💪`;
    };

// Weekly chart
const DAY_LABELS = ["Fri", "Sat", "Mon", "Tue", "Wed", "Thu"];

const getWeekDaysFridayStart = (referenceDate) => {
  const d = new Date(referenceDate + "T12:00:00");
  const jsDay = d.getDay(); // Sun=0, Mon=1, Tue=2, Wed=3, Thu=4, Fri=5, Sat=6

  // Find most recent Friday
  const daysFromFriday = (jsDay - 5 + 7) % 7;
  const fri = new Date(d);
  fri.setDate(d.getDate() - daysFromFriday);

  const offsets = [0, 1, 3, 4, 5, 6]; // Fri, Sat, Mon, Tue, Wed, Thu (skip Sunday)
  return offsets.map((offset) => {
    const dd = new Date(fri);
    dd.setDate(fri.getDate() + offset);
    return dd.toISOString().split("T")[0];
  });
};

function WeeklyChart({ storeName, allRecords, neonGreen }) {
  const storeRecords = allRecords.filter((r) => r.fields["Store"] === storeName);
  if (storeRecords.length === 0) return null;

  const latestDate = storeRecords
    .map((r) => r.fields["Date"])
    .filter(Boolean)
    .sort()
    .reverse()[0];

  if (!latestDate) return null;

  const weekDays = getWeekDaysFridayStart(latestDate);

  const barData = weekDays.map((date, idx) => {
    const dayRecs = storeRecords
      .filter((r) => r.fields["Date"] === date)
      .sort(
        (a, b) =>
          new Date(b.fields["Created"] || b.createdTime || 0) -
          new Date(a.fields["Created"] || a.createdTime || 0)
      );

    const val = dayRecs.length > 0 ? dayRecs[0].fields["Sales_Today"] || 0 : null;

    return {
      date,
      val,
      label: DAY_LABELS[idx],
      isToday: date === latestDate,
    };
  });

  const maxVal = Math.max(...barData.map((d) => d.val || 0), 1);

  const fmtK = (v) =>
    v >= 1000000
      ? "$" + (v / 1000000).toFixed(1) + "M"
      : v >= 1000
      ? "$" + (v / 1000).toFixed(0) + "K"
      : "$" + v;

  const chartH = 80;
  const barW = 28;
  const gap = 12;
  const totalW = barData.length * (barW + gap) - gap;

  return (
    <div className="bg-slate-900 rounded-lg p-4 border border-slate-800">
      <h3 className="text-slate-400 text-sm mb-3">Daily Sales This Week</h3>
      <svg width="100%" viewBox={`0 0 ${totalW + 10} ${chartH + 30}`} style={{ overflow: "visible" }}>
        {barData.map((d, i) => {
          const x = i * (barW + gap);
          const barH = d.val != null && d.val > 0 ? Math.max((d.val / maxVal) * chartH, 3) : 0;
          const y = chartH - barH;
          const color =
            d.val == null || d.val === 0
              ? "#1e293b"
              : d.isToday
              ? neonGreen
              : "rgba(34,197,94,0.4)";

          return (
            <g key={d.date}>
              <rect
                x={x}
                y={barH > 0 ? y : 0}
                width={barW}
                height={barH > 0 ? barH : chartH}
                rx="4"
                fill={color}
                opacity={barH === 0 ? 0.25 : 1}
              />
              {d.val != null && d.val > 0 && (
                <text
                  x={x + barW / 2}
                  y={y - 4}
                  textAnchor="middle"
                  fontSize="7"
                  fill={d.isToday ? neonGreen : "#94a3b8"}
                >
                  {fmtK(d.val)}
                </text>
              )}
              <text
                x={x + barW / 2}
                y={chartH + 14}
                textAnchor="middle"
                fontSize="9"
                fill={d.isToday ? neonGreen : "#64748b"}
                fontWeight={d.isToday ? "bold" : "normal"}
              >
                {d.label}
              </text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

    function SettingsScreen({ onClose, neonGreen }) {
      const [messages, setMessages] = useState(loadPresets());
      const [newMessage, setNewMessage] = useState("");
      const [editingIdx, setEditingIdx] = useState(null);
      const [editText, setEditText] = useState("");
      const save = (u) => {
        setMessages(u);
        savePresets(u);
      };

      const add = () => {
        const t = newMessage.trim();
        if (!t) return;
        save([...messages, t]);
        setNewMessage("");
      };

      const del = (idx) => {
        const u = messages.filter((_, i) => i !== idx);
        save(u);
      };

      const startEdit = (idx) => {
        setEditingIdx(idx);
        setEditText(messages[idx]);
      };

      const applyEdit = () => {
        if (editingIdx === null) return;
        const t = editText.trim();
        if (!t) return;
        const u = messages.map((m, i) => (i === editingIdx ? t : m));
        save(u);
        setEditingIdx(null);
        setEditText("");
      };

      const cancelEdit = () => {
        setEditingIdx(null);
        setEditText("");
      };

      return (
        <div className="min-h-screen bg-slate-950 text-white p-4">
          <div className="flex justify-between items-center mb-6">
            <button onClick={onClose} style={{ color: neonGreen }}>
              ← Back
            </button>
            <div className="text-lg font-bold" style={{ color: neonGreen }}>
              Settings
            </div>
            <div style={{ width: 60 }} />
          </div>

          <div className="bg-slate-900 rounded-lg p-4 border border-slate-800 mb-4">
            <div className="text-sm text-slate-400 mb-3">Preset Messages</div>

            <div className="flex gap-2 mb-4">
              <input
                value={newMessage}
                onChange={(e) => setNewMessage(e.target.value)}
                className="flex-1 bg-slate-950 border border-slate-700 rounded px-3 py-2 text-sm"
                placeholder="Add new preset message..."
              />
              <button onClick={add} className="px-4 py-2 rounded text-slate-950 font-medium" style={{ backgroundColor: neonGreen }}>
                Add
              </button>
            </div>

            <div className="space-y-2">
              {messages.map((msg, idx) => (
                <div key={idx} className="bg-slate-950 rounded border border-slate-800 p-3">
                  {editingIdx === idx ? (
                    <>
                      <textarea
                        value={editText}
                        onChange={(e) => setEditText(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm mb-2"
                        rows="2"
                      />
                      <div className="flex gap-2">
                        <button onClick={applyEdit} className="px-3 py-2 rounded text-slate-950 font-medium" style={{ backgroundColor: neonGreen }}>
                          Save
                        </button>
                        <button onClick={cancelEdit} className="px-3 py-2 rounded bg-slate-800 text-slate-200">
                          Cancel
                        </button>
                      </div>
                    </>
                  ) : (
                    <>
                      <div className="text-sm text-slate-200 whitespace-pre-wrap">{msg}</div>
                      <div className="flex gap-2 mt-3">
                        <button onClick={() => startEdit(idx)} className="px-3 py-2 rounded bg-slate-800 text-slate-200 text-xs">
                          Edit
                        </button>
                        <button onClick={() => del(idx)} className="px-3 py-2 rounded bg-slate-800 text-slate-200 text-xs">
                          Delete
                        </button>
                      </div>
                    </>
                  )}
                </div>
              ))}
            </div>
          </div>

          <div className="text-xs text-slate-500">
            Presets are saved to your browser on this device.
          </div>
        </div>
      );
    }

    function LoginScreen({ onLogin, error }) {
      const [pwd, setPwd] = useState("");

      return (
        <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center p-6">
          <div className="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-xl p-6">
            <div className="text-xl font-bold mb-2">RVP Dashboard</div>
            <div className="text-sm text-slate-400 mb-4">Enter password to continue</div>

            <input
              type="password"
              value={pwd}
              onChange={(e) => setPwd(e.target.value)}
              className="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-sm mb-3"
              placeholder="Password"
            />

            {error && <div className="text-sm text-red-400 mb-3">{error}</div>}

            <button
              onClick={() => onLogin(pwd)}
              className="w-full py-2 rounded font-medium text-slate-950"
              style={{ backgroundColor: "#00FF41" }}
            >
              Login
            </button>
          </div>
        </div>
      );
    }

    function TextModal({ store, allStores, timeframe, metric, onClose, neonGreen }) {
      const presets = loadPresets();
      const city = getCity(store);
      const smart = buildSmartMessage(store, allStores, timeframe, metric);

      const smsBody = encodeURIComponent(smart);
      const smsLinkIOS = `sms:&body=${smsBody}`;
      const smsLinkAndroid = `sms:?body=${smsBody}`;

      return (
        <div className="fixed inset-0 bg-black/70 flex items-end justify-center z-50">
          <div className="bg-slate-950 w-full max-w-lg rounded-t-2xl border border-slate-800 p-4">
            <div className="flex justify-between items-center mb-3">
              <div className="text-lg font-bold" style={{ color: neonGreen }}>
                Text {city}
              </div>
              <button onClick={onClose} className="text-slate-400">
                ✕
              </button>
            </div>

            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 mb-3">
              <div className="text-xs text-slate-500 mb-1">Suggested</div>
              <div className="text-sm text-slate-200 whitespace-pre-wrap">{smart}</div>
            </div>

            <div className="grid grid-cols-1 gap-2 mb-3">
              <a
                href={smsLinkIOS}
                className="w-full text-center py-3 rounded font-medium text-slate-950"
                style={{ backgroundColor: neonGreen }}
              >
                Open Messages (iPhone)
              </a>
              <a
                href={smsLinkAndroid}
                className="w-full text-center py-3 rounded font-medium bg-slate-800 text-slate-200"
              >
                Open Messages (Android)
              </a>
            </div>

            <div className="text-xs text-slate-500 mb-2">Preset quick texts</div>
            <div className="space-y-2 max-h-56 overflow-auto pb-2">
              {presets.map((m, i) => {
                const body = encodeURIComponent(m);
                return (
                  <a
                    key={i}
                    href={`sms:&body=${body}`}
                    className="block bg-slate-900 border border-slate-800 rounded-lg p-3 text-sm text-slate-200"
                  >
                    {m}
                  </a>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    function TextAllModal({ stores, timeframe, metric, onClose, neonGreen }) {
      const field = FIELD_MAP[metric][timeframe].current;
      const metricLabel = metric === "sales" ? "Sales" : "GP$";
      const timeLabel = TIME_LABEL[timeframe];

      const sorted = [...stores].sort((a, b) => (b[field] || 0) - (a[field] || 0));

      const lines = sorted.map((s, idx) => {
        const abbr = getAbbrev(s);
        const val = s[field] || 0;
        return `${idx + 1}. ${abbr} — ${fmtCurrency(val)}`;
      });

      const msg = `${metricLabel} Standings — ${timeLabel}\n` + lines.join("\n");
      const smsBody = encodeURIComponent(msg);
      const smsLinkIOS = `sms:&body=${smsBody}`;
      const smsLinkAndroid = `sms:?body=${smsBody}`;

      return (
        <div className="fixed inset-0 bg-black/70 flex items-end justify-center z-50">
          <div className="bg-slate-950 w-full max-w-lg rounded-t-2xl border border-slate-800 p-4">
            <div className="flex justify-between items-center mb-3">
              <div className="text-lg font-bold" style={{ color: neonGreen }}>
                Text All Managers
              </div>
              <button onClick={onClose} className="text-slate-400">
                ✕
              </button>
            </div>

            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3 mb-3">
              <div className="text-xs text-slate-500 mb-1">Standings</div>
              <pre className="text-sm text-slate-200 whitespace-pre-wrap">{msg}</pre>
            </div>

            <div className="grid grid-cols-1 gap-2">
              <a
                href={smsLinkIOS}
                className="w-full text-center py-3 rounded font-medium text-slate-950"
                style={{ backgroundColor: neonGreen }}
              >
                Open Messages (iPhone)
              </a>
              <a
                href={smsLinkAndroid}
                className="w-full text-center py-3 rounded font-medium bg-slate-800 text-slate-200"
              >
                Open Messages (Android)
              </a>
            </div>
          </div>
        </div>
      );
    }

    function RVPDashboard() {
      const [allRecords, setAllRecords] = useState([]);
      const [stores, setStores] = useState([]);
      const [loading, setLoading] = useState(true);
      const [timeframe, setTimeframe] = useState("today");
      const [metric, setMetric] = useState("sales");
      const [selectedStore, setSelectedStore] = useState(null);
      const [textStore, setTextStore] = useState(null);
      const [showTextModal, setShowTextModal] = useState(false);
      const [showTextAllModal, setShowTextAllModal] = useState(false);
      const [showSettings, setShowSettings] = useState(false);
      const [reportDate, setReportDate] = useState(null);
      const [createdTime, setCreatedTime] = useState(null);
      const [error, setError] = useState(null);
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [authError, setAuthError] = useState(null);
      const [password, setPassword] = useState(null);

      const neonGreen = "#00FF41",
        neonRed = "#FF0055";

      useEffect(() => {
        const p = localStorage.getItem("rvp-dashboard-password");
        if (p) {
          setPassword(p);
          setIsAuthenticated(true);
        } else {
          setLoading(false);
        }
      }, []);

      useEffect(() => {
        if (isAuthenticated && password) fetchStoreData();
      }, [isAuthenticated, password]);

      // Auto-refresh: every 2 minutes + when tab becomes active
      useEffect(() => {
        if (!isAuthenticated || !password) return;

        const intervalMs = 120000; // 2 minutes
        const id = setInterval(() => {
          fetchStoreData();
        }, intervalMs);

        const onVisible = () => {
          if (document.visibilityState === "visible") fetchStoreData();
        };

        window.addEventListener("focus", fetchStoreData);
        document.addEventListener("visibilitychange", onVisible);

        return () => {
          clearInterval(id);
          window.removeEventListener("focus", fetchStoreData);
          document.removeEventListener("visibilitychange", onVisible);
        };
      }, [isAuthenticated, password, metric, timeframe]);

      const handleLogin = (pwd) => {
        setPassword(pwd);
        setIsAuthenticated(true);
        setAuthError(null);
        localStorage.setItem("rvp-dashboard-password", pwd);
      };

      const handleLogout = () => {
        setIsAuthenticated(false);
        setPassword(null);
        setStores([]);
        setAllRecords([]);
        setAuthError(null);
        localStorage.removeItem("rvp-dashboard-password");
      };

      const fetchStoreData = async () => {
        try {
          setLoading(true);
          setError(null);
          const res = await fetch(API_URL, { headers: { "X-App-Password": password } });
          if (res.status === 401) {
            setAuthError("Invalid password.");
            handleLogout();
            return;
          }
          if (!res.ok) throw new Error("Failed to fetch data");

          const data = await res.json();
          const records = data.records || [];
          setAllRecords(records);

          const storeMap = {};
          records.forEach((r) => {
            const f = r.fields;
            const name = f["Store"];
            if (!name) return;
            const created = new Date(f["Created"] || r.createdTime || 0);
            const prior = storeMap[name];
            const priorCreated = prior ? new Date(prior.fields["Created"] || prior.createdTime || 0) : null;
            if (!prior || priorCreated < created) storeMap[name] = r;
          });

          const latest = Object.values(storeMap).map((r) => r.fields);
          setStores(latest);

          if (latest.length > 0) {
            setReportDate(latest[0]["Date"]);
            setCreatedTime(latest[0]["Created"] || null);
          }

          setLoading(false);
        } catch (err) {
          setError(err.message);
          setLoading(false);
        }
      };

      // --- Standings -> clipboard + open Messages ---
      const buildStandingsText = () => {
        const field = FIELD_MAP[metric][timeframe].current;
        const metricLabel = metric === "sales" ? "Sales" : "GP$";
        const timeLabel = TIME_LABEL[timeframe];

        const sorted = [...stores].sort((a, b) => (b[field] || 0) - (a[field] || 0));

        const lines = sorted.map((s, idx) => {
          const city = getCity(s);
          const val = s[field] || 0;
          return `${idx + 1}. ${city} — ${fmtCurrency(val)}`;
        });

        const header = `${metricLabel} Standings — ${timeLabel}${reportDate ? ` (${reportDate})` : ""}`;
        return [header, ...lines].join("\n");
      };

      const copyTextToClipboard = async (text) => {
        // Modern
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
        // Fallback
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return ok;
      };

      const openMessagesWithBody = (bodyText) => {
        const msg = encodeURIComponent(bodyText);

        // iOS: sms:&body=...  Android often accepts sms:?body=...
        const iosUri = `sms:&body=${msg}`;
        const androidUri = `sms:?body=${msg}`;

        window.location.href = iosUri;

        // Small fallback attempt for Android-like handling
        setTimeout(() => {
          try {
            window.location.href = androidUri;
          } catch {}
        }, 250);
      };

      const copyStandingsAndOpenMessages = async () => {
        const text = buildStandingsText();
        try {
          await copyTextToClipboard(text);
        } catch {}
        openMessagesWithBody(text);
      };

      const calcChange = (c, ly) => (!ly || ly === 0 ? null : ((c - ly) / ly) * 100);
      const getCur = (s) => s[FIELD_MAP[metric][timeframe].current] || 0;
      const getLY = (s) => s[FIELD_MAP[metric][timeframe].ly] || 0;

      // One canonical ordering for current metric+timeframe (used by list, swipe, ranking)
      const orderedStores = [...stores].sort((a, b) => getCur(b) - getCur(a));

      const getRankInfo = (store) => {
        if (!store) return { rank: null, total: orderedStores.length };
        const idx = orderedStores.findIndex((s) => s["Store"] === store["Store"]);
        return { rank: idx >= 0 ? idx + 1 : null, total: orderedStores.length };
      };
      const metricLabel = metric === "sales" ? "Sales" : "GP";
      const tfLabel = timeframe.toUpperCase();

      // Swipe
      const touchStart = useRef({ x: 0, y: 0 });

      const getSelectedIndex = () => {
        if (!selectedStore) return -1;
        return orderedStores.findIndex((s) => s["Store"] === selectedStore["Store"]);
      };

      const selectByOffset = (offset) => {
        if (!selectedStore || orderedStores.length === 0) return;
        const idx = getSelectedIndex();
        if (idx < 0) return;
        const nextIdx = (idx + offset + orderedStores.length) % orderedStores.length;
        setSelectedStore(orderedStores[nextIdx]);
      };

      const onDetailTouchStart = (e) => {
        const t = e.touches && e.touches[0];
        if (!t) return;
        touchStart.current = { x: t.clientX, y: t.clientY };
      };

      const onDetailTouchEnd = (e) => {
        const t = e.changedTouches && e.changedTouches[0];
        if (!t) return;

        const dx = t.clientX - touchStart.current.x;
        const dy = t.clientY - touchStart.current.y;

        if (Math.abs(dx) < 60) return;
        if (Math.abs(dx) < Math.abs(dy) * 1.2) return;

        if (dx < 0) selectByOffset(+1);
        else selectByOffset(-1);
      };

      const totalCur = stores.reduce((a, s) => a + (getCur(s) || 0), 0);
      const totalLY = stores.reduce((a, s) => a + (getLY(s) || 0), 0);
      const totalChange = calcChange(totalCur, totalLY);

      const ChangeLabel = ({ current, ly }) => {
        const c = calcChange(current, ly);
        if (c === null) return <span className="text-xs text-slate-500">No LY</span>;
        return (
          <span className="text-xs font-mono" style={{ color: c >= 0 ? neonGreen : neonRed }}>
            {c >= 0 ? "+" : ""}
            {c.toFixed(1)}%
          </span>
        );
      };

      const MetricBlock = ({ label, currentField, lyField, store }) => (
        <div>
          <div className="text-xs text-slate-500">{label}</div>
          <div className="text-lg font-mono">{fmtCurrency(store[currentField])}</div>
          <ChangeLabel current={store[currentField]} ly={store[lyField]} />
        </div>
      );

      const ArrowUp = ({ className, style }) => (
        <svg className={className} style={style} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <line x1="12" y1="19" x2="12" y2="5" />
          <polyline points="5 12 12 5 19 12" />
        </svg>
      );

      const ArrowDown = ({ className, style }) => (
        <svg className={className} style={style} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19" />
          <polyline points="19 12 12 19 5 12" />
        </svg>
      );

      const GearIcon = ({ className }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      );

      if (!isAuthenticated) return <LoginScreen onLogin={handleLogin} error={authError} />;
      if (showSettings) return <SettingsScreen onClose={() => setShowSettings(false)} neonGreen={neonGreen} />;

      if (loading) {
        return (
          <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center">
            <div className="text-lg">Loading dashboard...</div>
          </div>
        );
      }

      if (error) {
        return (
          <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4">
            <div className="text-center">
              <div className="text-4xl mb-4">⚠️</div>
              <div className="text-xl mb-2">Error Loading Data</div>
              <div className="text-sm text-slate-400 mb-4">{error}</div>
              <div className="flex gap-3 justify-center">
                <button onClick={fetchStoreData} className="px-6 py-2 bg-green-500 rounded">
                  Retry
                </button>
                <button onClick={handleLogout} className="px-6 py-2 bg-slate-700 rounded">
                  Logout
                </button>
              </div>
            </div>
          </div>
        );
      }

      if (stores.length === 0) {
        return (
          <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4">
            <div className="text-center">
              <div className="text-4xl mb-4">📊</div>
              <div className="text-xl mb-2">No Data Available</div>
              <div className="text-sm text-slate-400 mb-4">Waiting for daily sales data</div>
              <button onClick={handleLogout} className="px-6 py-2 bg-slate-700 rounded">
                Logout
              </button>
            </div>
          </div>
        );
      }

      // Detail view (swipe + rank badge)
      if (selectedStore) {
        const s = selectedStore;
        const { rank, total } = getRankInfo(s);
        const rankLine = rank ? `#${rank} ${metricLabel} ${tfLabel}` : `${metricLabel} ${tfLabel}`;

        return (
          <div className="min-h-screen bg-slate-950 text-white p-4" onTouchStart={onDetailTouchStart} onTouchEnd={onDetailTouchEnd}>
            {showTextModal && (
              <TextModal
                store={s}
                allStores={stores}
                timeframe={timeframe}
                metric={metric}
                onClose={() => setShowTextModal(false)}
                neonGreen={neonGreen}
              />
            )}

            <div className="flex justify-between items-center mb-4">
              <button onClick={() => setSelectedStore(null)} style={{ color: neonGreen }}>
                ← Back
              </button>
              <button onClick={handleLogout} className="text-xs text-slate-500">
                Logout
              </button>
            </div>

            <div className="mb-4">
              <div className="flex items-baseline gap-3">
                <h2 className="text-2xl font-bold" style={{ color: neonGreen }}>
                  {getAbbrev(s)}
                </h2>
                <span className="text-xs font-mono px-2 py-1 rounded border border-slate-700 text-slate-300">
                  {rankLine}{total ? ` / ${total}` : ""}
                </span>
              </div>
              <p className="text-sm text-slate-400">{s["Store"]}</p>
              <p className="text-xs text-slate-500 mt-1">{s["Date"]}</p>
              <p className="text-[11px] text-slate-600 mt-2">Swipe left/right to change stores</p>
            </div>

            <button
              onClick={() => setShowTextModal(true)}
              className="w-full mb-4 py-3 rounded font-medium text-slate-950 flex items-center justify-center gap-2"
              style={{ backgroundColor: neonGreen }}
            >
              💬 Send Encouragement
            </button>

            <div className="space-y-4">
              <div className="bg-slate-900 rounded-lg p-4 border border-slate-800">
                <h3 className="text-slate-400 text-sm mb-3">Sales</h3>
                <div className="grid grid-cols-4 gap-3">
                  <MetricBlock label="Today" currentField="Sales_Today" lyField="Sales_TodayLY" store={s} />
                  <MetricBlock label="WTD" currentField="Sales_WTD" lyField="Sales_WTDLY" store={s} />
                  <MetricBlock label="MTD" currentField="Sales_MTD" lyField="Sales_MTDLY" store={s} />
                  <MetricBlock label="YTD" currentField="Sales_YTD" lyField="Sales_YTDLY" store={s} />
                </div>
              </div>

              <div className="bg-slate-900 rounded-lg p-4 border border-slate-800">
                <h3 className="text-slate-400 text-sm mb-3">GP Dollars</h3>
                <div className="grid grid-cols-4 gap-3">
                  <MetricBlock label="Today" currentField="GP_Today" lyField="GP_TodayLY" store={s} />
                  <MetricBlock label="WTD" currentField="GP_WTD" lyField="GP_WTDLY" store={s} />
                  <MetricBlock label="MTD" currentField="GP_MTD" lyField="GP_MTDLY" store={s} />
                  <MetricBlock label="YTD" currentField="GP_YTD" lyField="GP_YTDLY" store={s} />
                </div>
              </div>

              <div className="bg-slate-900 rounded-lg p-4 border border-slate-800">
                <h3 className="text-slate-400 text-sm mb-3">GP %</h3>
                <div className="flex items-center gap-3">
                  <span className="text-xs text-slate-500">YTD</span>
                  <span className="text-2xl font-mono font-bold" style={{ color: neonGreen }}>
                    {s["GP%_YTD"] != null ? (s["GP%_YTD"] * 100).toFixed(1) + "%" : "—"}
                  </span>
                </div>
              </div>

              <WeeklyChart storeName={s["Store"]} allRecords={allRecords} neonGreen={neonGreen} />
            </div>
          </div>
        );
      }

      // Main overview
      const sortedStores = orderedStores;

      return (
        <div className="min-h-screen bg-slate-950 text-white p-4">
          {textStore && (
            <TextModal
              store={textStore}
              allStores={stores}
              timeframe={timeframe}
              metric={metric}
              onClose={() => setTextStore(null)}
              neonGreen={neonGreen}
            />
          )}
          {showTextAllModal && <TextAllModal stores={stores} timeframe={timeframe} metric={metric} onClose={() => setShowTextAllModal(false)} neonGreen={neonGreen} />}

          <div className="flex justify-between items-center mb-6">
            <div>
              <h1 className="text-2xl font-bold mb-1" style={{ color: neonGreen }}>
                RVP Dashboard
              </h1>
              <p className="text-sm text-slate-400">{reportDate || "Loading..."}</p>
              {createdTime && (
                <p className="text-xs text-slate-500">
                  Updated {new Date(createdTime).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}
                </p>
              )}
            </div>
            <div className="flex items-center gap-3">
              <button
                onClick={fetchStoreData}
                className="text-xs px-3 py-2 rounded border border-slate-700 text-slate-200"
                title="Refresh data"
              >
                ↻ Refresh
              </button>

              <button onClick={() => setShowSettings(true)} className="text-slate-500" title="Settings">
                <GearIcon className="w-5 h-5" />
              </button>

              <button onClick={handleLogout} className="text-xs text-slate-500">
                Logout
              </button>
            </div>
          </div>

          <div className="bg-gradient-to-r from-slate-900 to-slate-800 rounded-lg p-4 mb-4 border border-slate-700">
            <div className="text-sm text-slate-400 mb-1">Total {metric === "sales" ? "Sales" : "GP$"} — {timeframe.toUpperCase()}</div>
            <div className="text-3xl font-mono font-bold mb-1" style={{ color: neonGreen }}>
              {fmtCurrency(totalCur)}
            </div>
            {totalChange !== null && (
              <div className="flex items-center gap-2">
                {totalChange >= 0 ? <ArrowUp className="w-4 h-4" style={{ color: neonGreen }} /> : <ArrowDown className="w-4 h-4" style={{ color: neonRed }} />}
                <span className="text-sm font-mono" style={{ color: totalChange >= 0 ? neonGreen : neonRed }}>
                  {totalChange.toFixed(1)}% vs LY
                </span>
              </div>
            )}
          </div>

          <div className="flex gap-3 mb-6">
            <div className="flex-1 bg-slate-900 rounded-lg p-1 border border-slate-800">
              <div className="grid grid-cols-4 gap-1">
                {[
                  { value: "today", label: "Today" },
                  { value: "wtd", label: "WTD" },
                  { value: "mtd", label: "MTD" },
                  { value: "ytd", label: "YTD" },
                ].map((tf) => (
                  <button
                    key={tf.value}
                    onClick={() => setTimeframe(tf.value)}
                    className={"py-2 px-2 rounded text-xs font-medium " + (timeframe === tf.value ? "text-slate-950" : "text-slate-400")}
                    style={timeframe === tf.value ? { backgroundColor: neonGreen } : {}}
                  >
                    {tf.label}
                  </button>
                ))}
              </div>
            </div>

            <div className="bg-slate-900 rounded-lg p-1 border border-slate-800">
              <div className="grid grid-cols-2 gap-1">
                {[
                  { value: "sales", label: "Sales" },
                  { value: "gp", label: "GP$" },
                ].map((m) => (
                  <button
                    key={m.value}
                    onClick={() => setMetric(m.value)}
                    className={"py-2 px-3 rounded text-xs font-medium " + (metric === m.value ? "text-slate-950" : "text-slate-400")}
                    style={metric === m.value ? { backgroundColor: neonGreen } : {}}
                  >
                    {m.label}
                  </button>
                ))}
              </div>
            </div>
          </div>

          <div className="space-y-2 mb-4">
            {sortedStores.map((store) => {
              const cur = getCur(store);
              const ly = getLY(store);
              const change = calcChange(cur, ly);

              return (
                <div key={store["Store"]} className="w-full bg-slate-900 rounded-lg border border-slate-800 flex items-center overflow-hidden">
                  <button
                    onClick={(e) => {
                      e.stopPropagation();
                      setTextStore(store);
                    }}
                    className="flex-shrink-0 flex items-center justify-center px-3 h-full min-h-14 border-r border-slate-700"
                    style={{ minWidth: "52px" }}
                    title="Tap to text manager"
                  >
                    <span className="text-xs font-bold px-2 py-1 rounded" style={{ backgroundColor: "rgba(0,255,65,0.15)", color: neonGreen }}>
                      {getAbbrev(store)}
                    </span>
                  </button>

                  <button onClick={() => setSelectedStore(store)} className="flex-1 flex items-center justify-between p-4 text-left">
                    <div>
                      <div className="text-xs text-slate-500">{store["Store"]}</div>
                    </div>
                    <div className="flex items-center gap-3">
                      <div className="text-right">
                        <div className="font-mono text-lg">{fmtCurrency(cur)}</div>
                        {change !== null ? (
                          <div className="text-xs font-mono" style={{ color: change >= 0 ? neonGreen : neonRed }}>
                            {change >= 0 ? "+" : ""}
                            {change.toFixed(1)}%
                          </div>
                        ) : (
                          <div className="text-xs text-slate-600">No LY</div>
                        )}
                      </div>
                      <svg className="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <polyline points="9 18 15 12 9 6" />
                      </svg>
                    </div>
                  </button>
                </div>
              );
            })}
          </div>

          <button
            onClick={copyStandingsAndOpenMessages}
            className="w-full py-3 rounded font-medium text-slate-950"
            style={{ backgroundColor: neonGreen }}
          >
            📋 Copy Standings + Open Messages
          </button>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<RVPDashboard />);
  </script>
</body>
</html>
